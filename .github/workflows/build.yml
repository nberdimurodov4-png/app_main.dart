name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android --project-name nodirbek_card tmp_app
      - run: flutter pub add url_launcher
        working-directory: tmp_app
      - name: Manifest sozlash
        run: |
          python3 - <<'PY'
          p = 'tmp_app/android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          i = '<intent><action android:name="android.intent.action.VIEW"/><data android:scheme="%s"/></intent>'
          intents = ''.join(i % x for x in ['https', 'tel', 'mailto', 'tg'])
          if '<queries>' in s:
              s = s.replace('<queries>', '<queries>' + intents, 1)
          else:
              s = s.replace('<application', '<queries>' + intents + '</queries><application', 1)
          open(p, 'w', encoding='utf-8').write(s)
          PY
      - run: cp app_main.dart tmp_app/lib/main.dart
      - run: flutter build apk --release
        working-directory: tmp_app
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: tmp_app/build/app/outputs/flutter-apk/app-release.apk
